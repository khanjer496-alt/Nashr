# ---------------------------------------------------------------------------
# Nashr — in-container nginx (production).
#
# Derived from var/docker/nginx.conf (upstream Postiz), with three changes:
#   1. Runs entirely as the unprivileged `www` user: no `user` directive, and
#      every pid/temp/log path moved to /tmp or the container's std streams.
#   2. Security headers + server_tokens off.
#   3. A /nginx-health endpoint that does not touch the Node apps.
#
# This listens on 5000 only. TLS is terminated by Caddy in front of it; this
# port is never published to the host in docker-compose.prod.yaml.
# ---------------------------------------------------------------------------

worker_processes            auto;
pid                         /tmp/nginx.pid;
error_log                   /dev/stderr warn;

events {
    worker_connections      1024;
}

http {
    include                 /etc/nginx/mime.types;
    default_type            application/octet-stream;

    # Non-root cannot write to /var/lib/nginx or /var/cache/nginx.
    client_body_temp_path   /tmp/nginx-client-body;
    proxy_temp_path         /tmp/nginx-proxy;
    fastcgi_temp_path       /tmp/nginx-fastcgi;
    uwsgi_temp_path         /tmp/nginx-uwsgi;
    scgi_temp_path          /tmp/nginx-scgi;

    log_format  main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';
    access_log              /dev/stdout main;

    sendfile                on;
    tcp_nopush              on;
    server_tokens           off;
    keepalive_timeout       75s;

    # Video uploads are large. Caddy enforces the same ceiling at the edge.
    client_max_body_size    2G;
    client_body_timeout     300s;

    # Long-running AI/agent and publish requests.
    proxy_connect_timeout   30s;
    proxy_send_timeout      300s;
    proxy_read_timeout      300s;

    gzip                    on;
    gzip_vary               on;
    gzip_proxied            any;
    gzip_min_length         1024;
    gzip_types              text/plain text/css application/json application/javascript
                            text/xml application/xml application/xml+rss text/javascript
                            image/svg+xml;

    # Caddy sits on the compose network and is the only client. Trust its
    # X-Forwarded-For so rate limiting and logs see the real client IP.
    set_real_ip_from        10.0.0.0/8;
    set_real_ip_from        172.16.0.0/12;
    set_real_ip_from        192.168.0.0/16;
    set_real_ip_from        127.0.0.0/8;
    real_ip_header          X-Forwarded-For;
    real_ip_recursive       on;

    # WebSocket upgrade passthrough that still allows upstream keepalive when
    # the request is not an upgrade (empty Connection header, not "close").
    map $http_upgrade $nashr_connection_upgrade {
        default upgrade;
        ''      '';
    }

    upstream nashr_backend  { server 127.0.0.1:3000; keepalive 32; }
    upstream nashr_frontend { server 127.0.0.1:4200; keepalive 32; }

    server {
        listen              5000;
        server_name         _;

        # Defence in depth: Caddy sets these too, but the app container must be
        # safe even if someone points a second proxy at it.
        add_header          X-Content-Type-Options "nosniff" always;
        add_header          X-Frame-Options "SAMEORIGIN" always;
        add_header          Referrer-Policy "strict-origin-when-cross-origin" always;

        # Cheap liveness probe that never wakes the Node processes.
        location = /nginx-health {
            access_log      off;
            add_header      Content-Type text/plain always;
            return          200 "ok\n";
        }

        location /api/ {
            proxy_pass                  http://nashr_backend/;
            proxy_http_version          1.1;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Connection "";
            # Upstream Postiz reads these custom headers in its middleware.
            proxy_set_header Reload          $http_reload;
            proxy_set_header Onboarding      $http_onboarding;
            proxy_set_header Activate        $http_activate;
            proxy_set_header Auth            $http_auth;
            proxy_set_header Showorg         $http_showorg;
            proxy_set_header Impersonate     $http_impersonate;
            proxy_set_header Accept-Language $http_accept_language;
        }

        # Only reachable when STORAGE_PROVIDER=local. With STORAGE_PROVIDER=cloudflare
        # media is served from the R2 bucket URL and this block is dead weight.
        location /uploads/ {
            alias           /uploads/;
            expires         7d;
            add_header      Cache-Control "public, max-age=604800, immutable" always;
            add_header      X-Content-Type-Options "nosniff" always;
            # User-uploaded files are served sandboxed and script-free.
            add_header      Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'none'; script-src 'none'; frame-ancestors 'none'; sandbox" always;
            types {
                image/jpeg  jpg jpeg;
                image/png   png;
                image/gif   gif;
                image/webp  webp;
                image/avif  avif;
                image/bmp   bmp;
                image/tiff  tif tiff;
                video/mp4   mp4;
            }
            default_type    application/octet-stream;
        }

        location / {
            proxy_pass                  http://nashr_frontend/;
            proxy_http_version          1.1;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $nashr_connection_upgrade;
            proxy_set_header Reload          $http_reload;
            proxy_set_header Onboarding      $http_onboarding;
            proxy_set_header Activate        $http_activate;
            proxy_set_header Auth            $http_auth;
            proxy_set_header Showorg         $http_showorg;
            proxy_set_header Impersonate     $http_impersonate;
            proxy_set_header Accept-Language $http_accept_language;
            proxy_set_header i18next         $http_i18next;
        }
    }
}
