---
name: Build

on:
  push:
    # Feature branches are validated by the pull_request event below. Running
    # the same build again for every branch push created duplicate checks (and
    # duplicate red failures) on each PR. Keep a post-merge build on main.
    branches:
      - main
  merge_group:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    # Nashr modification: `nest build` for apps/backend OOMs at Node's default
    # ~2 GB heap on GitHub-hosted runners. This reproduces on pristine upstream
    # Postiz v1.47.0, so it is not caused by Nashr changes. Private-repo runners
    # have 7 GB RAM and `pnpm run build` uses --workspace-concurrency=1, so a
    # 5 GB heap leaves ample headroom.
    env:
      NODE_OPTIONS: --max-old-space-size=5120


    strategy:
      matrix:
        node-version: ['22.12.0']
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

#      - name: Setup pnpm cache
#        uses: actions/cache@v4
#        with:
#          path: |
#            ${{ env.STORE_PATH }}
#            ${{ github.workspace }}/.next/cache
#          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
#          restore-keys: |
#            ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

  verify:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=5120
      NASHR_TEST_PGHOST: 127.0.0.1
      NASHR_TEST_PGPORT: 5433
      NASHR_TEST_PGUSER: postgres
      NASHR_TEST_REDIS_URL: redis://127.0.0.1:6399
      PGHOST: 127.0.0.1
      PGPORT: 5433
      PGUSER: postgres

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6399:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.6.1
          run_install: false

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Nashr unit tests
        run: pnpm run test:nashr:unit

      - name: Nashr integration tests
        run: pnpm run test:nashr:integration

      - name: Migration drift verification
        run: pnpm run verify:nashr:migrations

      - name: Backup and restore drill
        run: pnpm run verify:nashr:backups
        env:
          # Run dump/restore with the same PostgreSQL major as the service.
          NASHR_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
          NASHR_REAL_DOCKER: /usr/bin/docker
