---
name: Build

on:
  push:
  merge_group:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    # Nashr modification: `nest build` for apps/backend OOMs at Node's default
    # ~2 GB heap on GitHub-hosted runners. This reproduces on pristine upstream
    # Postiz v1.47.0, so it is not caused by Nashr changes. Private-repo runners
    # have 7 GB RAM and `pnpm run build` uses --workspace-concurrency=1, so a
    # 5 GB heap leaves ample headroom.
    env:
      NODE_OPTIONS: --max-old-space-size=5120


    strategy:
      matrix:
        node-version: ['22.12.0']
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

#      - name: Setup pnpm cache
#        uses: actions/cache@v4
#        with:
#          path: |
#            ${{ env.STORE_PATH }}
#            ${{ github.workspace }}/.next/cache
#          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
#          restore-keys: |
#            ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build
