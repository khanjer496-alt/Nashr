---
name: "Code Quality Analysis"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/codeql.yml
      - apps/**
      - '!apps/docs/**'
      - libraries/**


jobs:
  analyze:
    name: Analyze (${{ matrix.language }})

    # GitHub only accepts CodeQL results from private repositories when GitHub
    # Code Security/Advanced Security is enabled. Keep the inherited upstream
    # scan active for public mirrors without turning a missing paid entitlement
    # into a permanently failing check on private forks.
    if: github.event.repository.private == false

    runs-on: 'ubuntu-latest'
    permissions:
      # Explicit job permissions default every omitted permission to `none`.
      # Private-repository checkout therefore needs this grant.
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
